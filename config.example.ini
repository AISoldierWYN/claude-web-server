# Claude Web Server — 主配置文件（项目根目录）
# 优先级：环境变量 > 本文件 > 代码内置默认值
# 修改后需重启服务

[server]
host = 0.0.0.0
port = 8080

[auth]
# 访问令牌；留空表示不启用 URL 鉴权（仍可被命令行 python server.py <token> 覆盖）
token =

[claude]
# Claude CLI 可执行文件路径；留空则自动查找（Windows：npm claude.cmd；Linux/macOS：~/.local/bin 等常见路径 + PATH）
cli_path =
# 若 CLI 支持，将附加 --model <值>；留空则不传
model =
# 传给 Claude CLI 的 --permission-mode，见 README
# Claude Web frontend selectable models.
model_options = glm-5, tc-code-latest, hunyuan-2.0-thinking
permission_mode = bypassPermissions
# 是否追加 --dangerously-skip-permissions（仅可信环境）
dangerously_skip_permissions = false
# 是否将会话子进程的 HOME 指到会话目录（隔离 ~/.claude，副作用见 README）
isolate_home = false
# 默认开启：为每个对话 fork 一个会话 HOME，继承父机 ~/.claude 的 skills/配置/凭证，但不继承全局 CLAUDE.md 记忆
fork_claude_home = true
# 外环编排：单次用户消息最多启动多少次完整 claude 子进程
orch_max_rounds = 20
# 附加 CLI 参数（按 shell 规则拆分，例如：--setting foo）；谨慎使用
extra_args =

[paths]
# 技能包/只读路径 JSON，相对项目根目录的文件名或子路径
paths_config_file = claude_web_paths.config.json
# 以下留空则使用项目根下默认目录名 cache、logs、backups、feedback
cache_dir =
log_dir =
backups_dir =
feedback_dir =

[upload]
# 单文件上传上限（MB）
max_size_mb = 100

[tavily]
# Tavily 联网搜索 API Key；也可用环境变量 TAVILY_API_KEY（兼容 TABILY_API_KEY）
api_key =
# basic 更省额度；advanced 更深入
search_depth = basic
max_results = 5

[gemini]
# Gemini CLI 可执行文件；留空则使用 PATH 中的 gemini
cli_path =
model =
# Web 第一版建议 plan，避免写操作等待交互确认导致 SSE 卡住
approval_mode = plan
sandbox = false
skip_trust = true
# 可选代理；例如 http://127.0.0.1:1080。留空则继承服务端已有环境变量。
proxy =
request_timeout_seconds = 300

[proxy]
# 信任 X-Forwarded-For（反向代理场景）
trust_x_forwarded = false

[readonly]
# 额外只读目录（与 JSON、环境变量合并）；分号或英文逗号分隔，路径中勿含这些分隔符
dirs =

[features]
# V2：开启后，通过 127.0.0.1/localhost 访问仍用服务器本机 API 配置；通过局域网 IP/域名访问时
# 使用各用户在侧栏「API 配置」中保存的 ANTHROPIC_* 等环境变量与 model（存于 cache 下用户目录）。
v2_multi_user_api = false
# V3：可选。标记「面向 Linux 服务器部署」时在日志中提示；**不**关闭时也可在 Linux 上运行（由 sys.platform 自动适配）。
v3_linux_deploy = false
mobile_remote_development = false
gemini_support = false
# Android 日志问题分析入口；开启后会使用 android_analysis_knowledge/ 保存本机共享规则和案例。
android_issue_analysis = false
# Android 分析专家工作台重构开关；第一版仅加载/校验项目知识包，不影响旧分析链路。
android_issue_analysis_expert_workbench = false

[development]
projects_config_file = claude_web_projects.config.json
permission_mode = acceptEdits
dangerously_skip_permissions = false
test_timeout_seconds = 300

[android_analysis]
# 本机共享知识目录，默认已被 .gitignore 忽略，不要提交真实项目规则/案例。
knowledge_dir = android_analysis_knowledge
# 每个项目根目录下的 Android 分析知识包相对路径。
project_knowledge_relative_path = .claude-web/android-analysis
# 可选 7-Zip 路径；用于受控解压 .rar，例如 C:\Program Files\7-Zip\7z.exe。
seven_zip_path =
# Planner/报告等 Claude CLI 调用超时，离线测试会使用 fallback，不依赖真实 CLI。
planner_timeout_seconds = 45
# Planner 首轮 prompt 字符预算；超出时会优先裁剪 file tree 和日志样本。
planner_prompt_budget_chars = 80000
# Planner 首轮 file tree 最大节点数。
planner_max_tree_nodes = 300
# Planner 首轮最多携带多少个日志样本文件。
planner_max_sample_files = 24
# Planner 首轮日志样本文本总字符上限。
planner_max_sample_chars = 50000
# Android 分析调试 trace；默认开启。开启后会写 artifacts/android_debug_trace.jsonl 并打印到服务端日志，包含每个 AI 环节的 token 统计。
debug_trace = true
# 首轮分析置信度低于该阈值时自动进入 Deep；达到阈值时仅保留前端 Deep 按钮，由用户按需触发。
auto_deep_confidence_threshold = 0.72
